name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# A tag builds and publishes. A manual dispatch builds the same artifacts and
# uploads them to the run, but never creates a release, so the whole path can
# be exercised without minting a version.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RETOUCH_SKIP_WORKER: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Build the app
        env:
          RETOUCH_ARCH: arm64
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci"
          fi
          RETOUCH_VERSION="$VERSION" RETOUCH_BUILD="$GITHUB_RUN_NUMBER" ./build.sh release
      - name: Package DMG
        run: ./Tools/make-dmg.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            RetouchStudio-*-arm64.dmg
            RetouchStudio-*-arm64.dmg.sha256
          if-no-files-found: error

  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RETOUCH_SKIP_WORKER: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Build the Intel slice and self-test it
        env:
          RETOUCH_ARCH: x86_64
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci"
          fi
          RETOUCH_VERSION="$VERSION" RETOUCH_BUILD="$GITHUB_RUN_NUMBER" ./build.sh release
      - name: Package DMG
        run: ./Tools/make-dmg.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64
          path: |
            RetouchStudio-*-x86_64.dmg
            RetouchStudio-*-x86_64.dmg.sha256
          if-no-files-found: error

  windows-core:
    name: Windows StudioCore
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the Swift toolchain
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          build_arch: amd64
      - name: Build and run the portable core tests
        shell: pwsh
        run: ./Tests/run-studiocore-windows.ps1
      - name: Run the platform-neutral conformance gate
        shell: bash
        env:
          CC: clang
          PYTHON: python
        run: ./Tests/Conformance/run-conformance.sh

  # The application ships when the product owner declares it ready by setting
  # the repository variable WINDOWS_APP_READY=true. `hashFiles` cannot gate a
  # job before checkout, so the gate is explicit. The job builds and tests the
  # same host the CI `Windows App` job proves, including the MSI install,
  # upgrade and uninstall, and uploads the zip and MSI with their checksums.
  windows-app:
    name: Windows x64 application
    runs-on: windows-2025
    timeout-minutes: 60
    if: ${{ vars.WINDOWS_APP_READY == 'true' }}
    env:
      RETOUCH_SKIP_WORKER: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install the Swift toolchain
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          build_arch: amd64
      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build, test, package and smoke-run the Windows application
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else { '0.0.0-ci' }
          ./Tools/build-windows.ps1 -RequireMsi -PackageVersion $version
      - name: Upload the published host on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-publish
          path: build/windows/app/**
          if-no-files-found: ignore
      - name: Upload the zip, the MSI and their checksums
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            build/windows/dist/*.zip
            build/windows/dist/*.zip.sha256
            build/windows/dist/*.msi
            build/windows/dist/*.msi.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # A manual dispatch must never publish anything; only a version tag does.
    if: startsWith(github.ref, 'refs/tags/v')
    # Windows is a product platform, so a release waits for its package too.
    needs: [macos-arm64, macos-x86_64, windows-core, windows-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify every checksum before publishing
        run: |
          set -euo pipefail
          cd artifacts
          for manifest in *.sha256; do
            sha256sum -c "$manifest"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Retouch Studio ${GITHUB_REF_NAME#v}" \
            --generate-notes
