name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RETOUCH_SKIP_WORKER: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Build the app
        env:
          RETOUCH_ARCH: arm64
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          RETOUCH_VERSION="$VERSION" RETOUCH_BUILD="$GITHUB_RUN_NUMBER" ./build.sh release
      - name: Package DMG
        run: ./Tools/make-dmg.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            RetouchStudio-*-arm64.dmg
            RetouchStudio-*-arm64.dmg.sha256
          if-no-files-found: error

  macos-x86_64:
    name: macOS x86_64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RETOUCH_SKIP_WORKER: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Build the Intel slice and self-test it
        env:
          RETOUCH_ARCH: x86_64
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          RETOUCH_VERSION="$VERSION" RETOUCH_BUILD="$GITHUB_RUN_NUMBER" ./build.sh release
      - name: Package DMG
        run: ./Tools/make-dmg.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64
          path: |
            RetouchStudio-*-x86_64.dmg
            RetouchStudio-*-x86_64.dmg.sha256
          if-no-files-found: error

  windows-core:
    name: Windows StudioCore
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the Swift toolchain
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          build_arch: amd64
      - name: Build and run the portable core tests
        shell: pwsh
        run: ./Tests/run-studiocore-windows.ps1
      - name: Run the platform-neutral conformance gate
        shell: bash
        env:
          CC: clang
          PYTHON: python
        run: ./Tests/Conformance/run-conformance.sh

  # Enable this job only after a real Windows application exists under
  # Windows/ and Tools/build-windows.ps1 has produced a runnable light editor.
  # `hashFiles` is not available in a job-level `if` (the workspace is not
  # checked out yet), so the gate is an explicit repository variable:
  # set `WINDOWS_APP_READY=true` once those paths exist. Until then the job is
  # skipped, so a green run never implies a Windows product.
  windows-app:
    name: Windows x64 application
    runs-on: windows-2025
    timeout-minutes: 60
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_APP_READY == 'true' }}
    env:
      RETOUCH_SKIP_WORKER: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install the Swift toolchain
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          build_arch: amd64
      - name: Build the Windows application
        shell: pwsh
        run: ./Tools/build-windows.ps1
      - name: Package and checksum
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.0' }
          ./Tools/package-windows.ps1 -AppDir build/windows -Version $version
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/RetouchStudio-*-windows-x64.zip
            dist/RetouchStudio-*-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # A manual dispatch must never publish anything; only a version tag does.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-arm64, macos-x86_64, windows-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify every checksum before publishing
        run: |
          set -euo pipefail
          cd artifacts
          for manifest in *.sha256; do
            sha256sum -c "$manifest"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Retouch Studio ${GITHUB_REF_NAME#v}" \
            --generate-notes
