name: CI

on:
  pull_request:
    # Stacked milestone branches are listed beside the integration branches:
    # a PR whose base is a feature branch must pass the same five contexts
    # before it can be judged ready, not only PRs that end on `main` or
    # `develop`.
    branches: [main, develop, 'w5-**']
  push:
    # `main` is deliberately absent. With strict required checks the pull
    # request run checks out `refs/pull/N/merge`, whose tree is exactly the
    # merge commit's tree, so a push run on `main` repeats a matrix that has
    # already passed for that tree. Use `workflow_dispatch` for an ad-hoc run.
    branches:
      - v1-macos-delivery
      - m5-cross-platform-core
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  studioscore-boundary:
    name: StudioCore Boundary
    # macos-15 is the current GitHub-hosted Apple-silicon runner label.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          set -euo pipefail
          uname -m
          swiftc --version
          xcode-select -p

      - name: Run StudioCore boundary gate
        run: |
          set -euo pipefail
          ./Tests/run-studiocore.sh 2>&1 | tee "$RUNNER_TEMP/studioscore-boundary.log"

      - name: Assert the gate compiled and ran its tests
        run: |
          set -euo pipefail
          grep -qE 'StudioCore: [0-9]+ checks passed' "$RUNNER_TEMP/studioscore-boundary.log"
          grep -qE 'Upscale ETA: [0-9]+ checks passed' "$RUNNER_TEMP/studioscore-boundary.log"

      - name: Upload gate log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: studioscore-boundary-log
          path: ${{ runner.temp }}/studioscore-boundary.log
          if-no-files-found: ignore

  platform-conformance:
    name: Platform-neutral Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          set -euo pipefail
          python3 -c 'import sys; print(sys.version); assert sys.version_info >= (3, 10), sys.version'
          cc --version

      - name: Assert the macOS and Windows version sources agree
        run: ./Tools/check-versions.sh

      # The app's licence records are the worker table's own, and this is the
      # only step that can prove it: regenerate the resource from the table and
      # require that the committed bytes are already the result. `--check`
      # fails first with the precise message; the two full runs then prove the
      # write is idempotent, so the recorded position cannot depend on how many
      # times the generator has run. If anything is written, the golden-corpus
      # step below also refuses the dirty tree.
      - name: Assert the licence records match the worker table
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 Docs/licence-evidence-apply.py --check
          python3 Docs/licence-evidence-apply.py
          first="$(sha256sum Resources/model-catalog.json)"
          python3 Docs/licence-evidence-apply.py
          second="$(sha256sum Resources/model-catalog.json)"
          test "$first" = "$second"
          echo "catalogue idempotent: $first"

      - name: Run conformance gate
        run: |
          set -euo pipefail
          ./Tests/Conformance/run-conformance.sh 2>&1 | tee "$RUNNER_TEMP/conformance.log"

      - name: Assert the conformance verdicts
        run: |
          set -euo pipefail
          grep -qx 'R1 conformance: PASS' "$RUNNER_TEMP/conformance.log"
          grep -qx 'studioscore abi=1 status_count=20 error_codes=20' "$RUNNER_TEMP/conformance.log"

      - name: Assert the golden corpus is unchanged
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "the conformance gate modified tracked or untracked files" >&2
            exit 1
          fi

      - name: Upload gate log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-log
          path: ${{ runner.temp }}/conformance.log
          if-no-files-found: ignore

  macos-integration:
    name: macOS Integration
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          set -euo pipefail
          uname -m
          swiftc --version
          xcode-select -p

      # The handshake suite must run on the interpreter the app ships, not on
      # the runner's Python. Build the pinned source runtime, then create the
      # hashed test environment from that exact interpreter.
      - name: Build the pinned source runtime
        run: |
          set -euo pipefail
          for formula in openssl@3 xz sqlite; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          runtime="$(./Tools/build-python-runtime.sh)"
          echo "source runtime: $runtime"
          "$runtime" -c 'import ssl, sqlite3, lzma, zlib, sys; print(sys.version)'

      - name: Create the hashed worker environment
        run: |
          set -euo pipefail
          runtime="$(./Tools/build-python-runtime.sh)"
          RETOUCH_PYTHON="$runtime" ./Tools/setup-worker-venv.sh

      - name: Run the worker regressions
        run: |
          set -euo pipefail
          ./Tests/run-worker.sh 2>&1 | tee "$RUNNER_TEMP/macos-integration.log"

      - name: Run StudioCore gate
        run: |
          set -euo pipefail
          ./Tests/run-studiocore.sh 2>&1 | tee -a "$RUNNER_TEMP/macos-integration.log"

      - name: Run engine, model and runtime suites
        env:
          RETOUCH_ARCH: arm64
        run: |
          set -euo pipefail
          ./Tests/run.sh 2>&1 | tee -a "$RUNNER_TEMP/macos-integration.log"

      - name: Assert every suite reported a verdict
        run: |
          set -euo pipefail
          expected_worker_tests=$(tr -d '[:space:]' < Tests/expected-worker-tests.txt)
          for verdict in \
            "Ran ${expected_worker_tests} tests" \
            'StudioCore: [0-9]+ checks passed' \
            'Upscale ETA: [0-9]+ checks passed' \
            'ENGINE TESTS: PASS' \
            'MODEL TESTS: PASS' \
            'MODEL STORE TESTS: PASS' \
            'RUNTIME PROCESS TESTS: PASS' \
            'RUNTIME V2 TESTS: PASS' \
            'AI DISCLOSURE TESTS: PASS' \
            'AI FAILURE TAXONOMY TESTS: PASS \(71 checks\)' \
            'RUNTIME INSTALL TESTS: PASS' \
            'RUNTIME TRANSFER TESTS: PASS \([0-9]+ checks, [0-9]+ skipped\)'; do
            grep -qE "$verdict" "$RUNNER_TEMP/macos-integration.log"
            echo "found: $verdict"
          done
          # A required check that skipped itself prints "NOT run" and still
          # exits 0. That is not a pass: the transfer suite's real-volume
          # unpack must actually run on this runner.
          if grep -qE 'NOT run' "$RUNNER_TEMP/macos-integration.log"; then
            echo "a required transfer test did not run:" >&2
            grep -E 'NOT run' "$RUNNER_TEMP/macos-integration.log" >&2
            exit 1
          fi
          echo "no transfer test reported NOT run"

      - name: Upload suite log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-integration-log
          path: |
            ${{ runner.temp }}/macos-integration.log
            build/python-runtime/configure.log
            build/python-runtime/make.log
            build/python-runtime/install.log
          if-no-files-found: ignore

  # The app ships `worker/requirements.lock`; the suite installs only
  # `requirements-test.lock`. That split is right for speed — and it is how an
  # unpinned import once reached the owner's machine: the engine imported
  # `cv2`, the tests never loaded it, and the break surfaced as an ImportError
  # behind an AI feature. This job proves the shipping lock on the platform
  # whose wheels are the ones that ship. It resolves every pin, downloads each
  # artefact to check the recorded SHA-256, installs nothing, then hands pip's
  # report to `worker/tools/lock_closure.py`, which proves the report is
  # exactly the locked set: no direct URL, no version pip chose, no
  # distribution the lock does not name, and nothing the lock pins missing.
  # The same script re-runs the source-level import closure; the new suite in
  # `Tests/run-worker.sh` runs it too, so a missing pin also fails the
  # required macOS Integration job even before this one is configured as a
  # required check.
  #
  # Measured locally on macOS arm64 with Python 3.13: 304.6 MB downloaded in
  # 169.8 s. Linux is not used on purpose: the recorded hashes are macOS
  # wheels, so a Linux resolution would fail for the wrong reason and would
  # say nothing about the payload that ships.
  worker-lock-closure:
    name: Worker Lock Closure
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the interpreter the locks are written for
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Record toolchain
        run: |
          set -euo pipefail
          uname -m
          python --version
          python -m pip --version

      # --no-cache-dir keeps the recorded cost honest: a warm cache would
      # report a number a fresh runner cannot reproduce.
      - name: Resolve the full runtime lock without installing
        run: |
          set -euo pipefail
          started=$(date +%s)
          # --ignore-installed keeps the report independent of whatever the
          # runner image already has: a pin the image happens to satisfy would
          # otherwise drop out of "install" and read as a lock failure.
          python -m pip install --no-cache-dir --ignore-installed \
            --require-hashes --no-deps --dry-run \
            --report "$RUNNER_TEMP/runtime-report.json" \
            -r worker/requirements.lock
          echo "resolver wall time: $(( $(date +%s) - started ))s"

      - name: Prove the lock closes over the shipped imports
        run: |
          set -euo pipefail
          python worker/tools/lock_closure.py \
            --report "$RUNNER_TEMP/runtime-report.json" \
            | tee "$RUNNER_TEMP/lock-closure.log"
          grep -qE '^WORKER LOCK CLOSURE: PASS \([0-9]+ distributions, [0-9]+ imported modules\)$' \
            "$RUNNER_TEMP/lock-closure.log"

      - name: Upload the closure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: worker-lock-closure-log
          path: |
            ${{ runner.temp }}/lock-closure.log
            ${{ runner.temp }}/runtime-report.json
          if-no-files-found: ignore

  # What the app actually ships is a copy of the interpreter, the worker
  # package and the full site-packages, assembled by `Tools/bundle-worker.sh`.
  # No CI job ever ran that script — the release job sets
  # RETOUCH_SKIP_WORKER=1 — so the distributable helper tree was never built or
  # inspected on a runner. This job builds it end to end into a scratch app
  # bundle, packages the archive with `Tools/make-runtime.sh`, and inspects
  # it: the three payload documents and the interpreter at the archive root,
  # the exact locked distribution set read from each dist-info's `METADATA`
  # with only the venv's pip as a verified allowance, licence files inside
  # those dist-info directories, the archive's byte size and SHA-256, and the
  # import smoke run by the extracted runtime with the same
  # PYTHONHOME/PYTHONPATH the app sets at launch.
  #
  # It is `continue-on-error` on purpose: this is the first time the payload is
  # built in CI, so a failure is evidence to act on, not a merge gate. It
  # removes nothing, changes no dependency and downloads no model. The owner's
  # promotion criteria (2026-11-21) are recorded in `Docs/CI_GATES.md`; the
  # commands, expected evidence and remaining unverified paths are in
  # `Docs/WORKER_CI_VALIDATION_PLAN.md`. This job is not a required context.
  # Measured locally: the full
  # lock unpacks to 1.4 GB of site-packages (67 pinned distributions plus the
  # venv's own pip), and the source runtime is built from source here exactly
  # as the macOS Integration job builds it.
  worker-payload-bundle:
    name: Worker Payload Bundle
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Record toolchain
        run: |
          set -euo pipefail
          uname -m
          sw_vers

      - name: Build the pinned source runtime
        run: |
          set -euo pipefail
          for formula in openssl@3 xz sqlite; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          runtime="$(./Tools/build-python-runtime.sh)"
          echo "source runtime: $runtime"
          echo "PYTHON_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Install the full runtime lock
        run: |
          set -euo pipefail
          started=$(date +%s)
          RETOUCH_PYTHON="$PYTHON_RUNTIME" ./Tools/setup-worker-venv.sh --full
          echo "full-lock install wall time: $(( $(date +%s) - started ))s"
          du -sh worker/.venv worker/.venv/lib/python3.13/site-packages

      # The lock installs with --no-deps, so a requirement the lock forgets
      # would only surface when the package is used. `pip check` reads every
      # installed distribution's metadata and names each unsatisfied
      # requirement. Exactly one is expected: mflux declares opencv-python for
      # its optional ControlNet/OpenPose preprocessing, which the worker never
      # runs — the lock deliberately leaves it out, and the setup script's
      # --no-deps comment records that. Anything else is the missing-pin
      # failure this job exists to catch.
      #
      # The gate judges status, stdout and stderr together. The previous
      # `check=$(... || true)` captured stdout only: a pip that crashed before
      # printing left an empty capture and the step passed. `pip_check_gate.py`
      # accepts status 0 only with the clean verdict and status 1 only with the
      # documented line, and fails on any other status, empty output or a
      # traceback. Seedings: `worker/tests/test_pip_check_gate.py`.
      - name: Every installed requirement is satisfied except the documented one
        run: |
          set -euo pipefail
          worker/.venv/bin/python3 worker/tools/pip_check_gate.py

      # The fixed eight targets are a critical-path floor, not the coverage.
      # `import_smoke.py` adds every third-party top-level module the shipped
      # package imports (the same AST walk `lock_closure.py` uses), fails a
      # fixed target the code no longer imports, and names an unpinned import
      # as the lock closure's failure instead of importing it. The required
      # macOS job runs the lock closure tests, so an unpinned import cannot
      # escape both checks. Seedings: `worker/tests/test_import_smoke.py`.
      - name: Import the modules the shipped worker loads lazily
        run: |
          set -euo pipefail
          started=$(date +%s)
          worker/.venv/bin/python3 worker/tools/import_smoke.py
          echo "import smoke wall time: $(( $(date +%s) - started ))s"

      - name: Bundle the helper and package the runtime archive
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/payload/Retouch Studio.app"
          mkdir -p "$app/Contents/Resources" "$RUNNER_TEMP/payload/out"
          ./Tools/bundle-worker.sh "$app"
          cd "$RUNNER_TEMP/payload/out"
          "$GITHUB_WORKSPACE/Tools/make-runtime.sh" \
            "$app/Contents/Resources/Worker" 0.0.0-ci
          echo "RUNTIME_ZIP=$RUNNER_TEMP/payload/out/RetouchStudio-0.0.0-ci-ai-runtime-arm64.zip" >> "$GITHUB_ENV"

      # `make-runtime.sh` zips the Worker folder itself, so these names are
      # exactly what extraction puts at the root of an installed runtime. The
      # archive is the evidence that the payload carries its own documents and
      # every locked distribution's metadata and licences.
      #
      # The comparison is identity, not count. `dist-info directories >= pinned
      # requirements` passed because the venv ships 68 for 67 pins (the extra is
      # pip), and it also passed for a duplicated, renamed or wrong-version
      # distribution. `verify_payload.py` reads each `METADATA` and compares the
      # `(canonical name, version)` set with the lock, requires a `RECORD` in
      # every dist-info and a directory name that matches its metadata, and
      # allows exactly one extra: pip, at the version the building interpreter
      # reports. Seedings: `worker/tests/test_payload_verification.py`.
      - name: Inspect the runtime archive
        run: |
          set -euo pipefail
          out="$RUNTIME_ZIP"
          pip_version=$(worker/.venv/bin/python3 -m pip --version | awk '{print $2}')
          echo "environment pip: $pip_version"
          stat -f 'archive bytes: %z' "$out"
          shasum -a 256 "$out"
          worker/.venv/bin/python3 worker/tools/verify_payload.py \
            --archive "$out" \
            --lock worker/requirements.lock \
            --pip-version "$pip_version"

      # Extract with ditto, the same tool the archive was made with, so symlinks
      # inside the runtime survive. The imports then run under the environment
      # `AIRuntimeValidation` constructs: the payload's own framework as home,
      # the payload root and site-packages on PYTHONPATH, no user site.
      - name: Import from the extracted runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          ditto -x -k "$RUNTIME_ZIP" "$RUNNER_TEMP/runtime"
          root="$RUNNER_TEMP/runtime"
          home=$(ls -d "$root"/Python.framework/Versions/3.13)
          PYTHONHOME="$home" \
          PYTHONPATH="$root:$root/site-packages" \
          PYTHONNOUSERSITE=1 \
          PYTHONDONTWRITEBYTECODE=1 \
            "$root/bin/python3" worker/tools/import_smoke.py

  windows-core:
    name: Windows StudioCore
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install the Swift toolchain
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          build_arch: amd64
          # The installer download is the slowest step on this image and has
          # exceeded the job budget once; the action caches the download.
          cache: true

      - name: Record toolchain
        shell: pwsh
        run: |
          swiftc --version
          $PSVersionTable.PSVersion.ToString()

      - name: Build StudioCore and run the core plus C ABI tests
        shell: pwsh
        run: ./Tests/run-studiocore-windows.ps1 *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-core.log')

      - name: Run the platform-neutral conformance gate
        shell: bash
        env:
          # Git Bash on the Windows image has no `cc`; the Swift toolchain
          # installs clang.exe and puts it on PATH. Python is on PATH as
          # `python`, not `python3`.
          CC: clang
          PYTHON: python
        run: ./Tests/Conformance/run-conformance.sh

      # A green tee step only means the pipeline ended, not that the script
      # completed its checks. A script that threw partway simply never prints
      # its final verdict, so this step is what fails the job; the same
      # pattern the Windows App job applies.
      - name: Assert the Windows portability verdict
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-core.log'
          if (-not (Select-String -Path $log -Pattern 'StudioCore Windows portability check: PASS' -SimpleMatch -Quiet)) {
            throw 'the Windows StudioCore script never reported its PASS verdict'
          }
          Write-Host 'found: StudioCore Windows portability check: PASS'

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-core-log
          path: |
            build/**/*.log
            ${{ runner.temp }}/windows-core.log
            ${{ runner.temp }}/conformance.log
          if-no-files-found: ignore

  # The host itself, not just the shared core: builds studioscore_core.dll,
  # publishes the self-contained WPF app, runs the headless host tests against
  # the real DLL and Windows Imaging Component, and smoke-runs the published
  # exe until it opens a window. Required on `main` since 2026-11-14; it proves
  # a Windows build and runtime start, nothing about an installer or a release.
  windows-app:
    name: Windows App
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install the Swift toolchain
        uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
          build_arch: amd64
          # The installer download is the slowest step on this image and has
          # exceeded the job budget once; the action caches the download.
          cache: true

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Record toolchains
        shell: pwsh
        run: |
          swiftc --version
          dotnet --version
          dotnet --list-runtimes

      - name: Build, test and smoke-run the Windows host
        shell: pwsh
        run: ./Tools/build-windows.ps1 -RequireMsi *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-app.log')

      # A green job alone only means the script stopped. These lines are what the
      # run proved about Windows AI, and the missing-argument refusal among them:
      # a script that threw partway simply never prints the later verdicts, so
      # this step is what fails the job and the log is kept as the evidence.
      - name: Assert every Windows verdict was reported
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-app.log'
          foreach ($verdict in @(
            'WINDOWS APP BUILD: PASS',
            'AI RUNTIME TESTS: PASS',
            'ONNX Runtime 1.32.0 matches the recorded size and SHA-256',
            'AI worker, protocol library and ORT CPU payload present',
            'upscale stays blocked without an approved artifact')) {
            if (-not (Select-String -Path $log -Pattern $verdict -SimpleMatch -Quiet)) {
              throw "the Windows log never reported: $verdict"
            }
            Write-Host "found: $verdict"
          }

      - name: Upload the packaged zip and MSI
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: build/windows/dist/**
          if-no-files-found: error

      - name: Upload the published host on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-publish
          path: |
            build/windows/app/**
            ${{ runner.temp }}/windows-app.log
          if-no-files-found: ignore
